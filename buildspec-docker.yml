version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - curl -fsSL https://bun.sh/install | bash
      - export PATH="$HOME/.bun/bin:$PATH"
      - bun --version

  pre_build:
    commands:
      - bun install --frozen-lockfile
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - if [ -n "${DOCKER_HUB_USERNAME:-}" ] && [ -n "${DOCKER_HUB_TOKEN:-}" ]; then echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin; fi

  build:
    commands:
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)

      # Build workspace dependencies FIRST. @chimera/core, @chimera/shared,
      # and @chimera/sse-bridge each compile TS → dist/*.js via `tsc`. The
      # chat-gateway bundle below resolves `@chimera/core` to its `main`
      # field (dist/index.js). Without this step, the bundler pulls in
      # whatever dist was last committed in git — which is gitignored and
      # will either be missing (build fails) or stale from a developer's
      # machine (silent regression). This caused chimera-e026 to persist
      # in production even after the fix was deployed — the agent.ts
      # source change never reached dist. Wave-26.
      - bun run --cwd packages/shared build
      - bun run --cwd packages/core build
      - bun run --cwd packages/sse-bridge build

      # Pre-bundle chat-gateway at CodeBuild time (full monorepo available here)
      # This resolves @chimera/shared, @chimera/core, @chimera/sse-bridge workspace deps
      # so the Docker image needs no workspace resolution at all — just copies dist/server.js
      - bun build packages/chat-gateway/src/server.ts --outdir packages/chat-gateway/dist --target bun

      # Build and push chat-gateway image with immutable git-SHA tag only.
      # ECR repositories are IMMUTABLE (Wave-17 M-2); pushing `:latest` would
      # fail on the second run. Downstream consumers reference the SHA tag
      # via $CHAT_GATEWAY_IMAGE_URI / $AGENT_IMAGE_URI exported below.
      - docker build -t $ECR_REPOSITORY_CHAT_GATEWAY:$IMAGE_TAG -f packages/chat-gateway/Dockerfile .
      - docker push $ECR_REPOSITORY_CHAT_GATEWAY:$IMAGE_TAG
      - echo "$ECR_REPOSITORY_CHAT_GATEWAY:$IMAGE_TAG" > chat-gateway-image-uri.txt
      - export CHAT_GATEWAY_IMAGE_URI="$ECR_REPOSITORY_CHAT_GATEWAY:$IMAGE_TAG"

      # Build and push agent image (Python + uv) with SHA tag only.
      - docker build -t $ECR_REPOSITORY_AGENT:$IMAGE_TAG -f packages/agents/Dockerfile packages/agents/
      - docker push $ECR_REPOSITORY_AGENT:$IMAGE_TAG
      - echo "$ECR_REPOSITORY_AGENT:$IMAGE_TAG" > agent-image-uri.txt
      - export AGENT_IMAGE_URI="$ECR_REPOSITORY_AGENT:$IMAGE_TAG"

      # Backward compatibility: keep image-uri.txt pointing to agent image
      - echo "$ECR_REPOSITORY_AGENT:$IMAGE_TAG" > image-uri.txt
      - export IMAGE_URI="$ECR_REPOSITORY_AGENT:$IMAGE_TAG"

artifacts:
  files:
    - image-uri.txt
    - chat-gateway-image-uri.txt
    - agent-image-uri.txt
  name: ChimeraDockerOutput

env:
  exported-variables:
    - IMAGE_URI
    - IMAGE_TAG
    - CHAT_GATEWAY_IMAGE_URI
    - AGENT_IMAGE_URI

cache:
  paths:
    - $HOME/.bun/install/cache/**/*
    - node_modules/**/*
